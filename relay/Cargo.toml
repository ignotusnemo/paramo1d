[package]
name = "paramo1d-relay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bounded store-and-forward delivery for Paramo1d"

[dependencies]
paramo1d-courier = { path = "../courier" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
